name: Deploy to cPanel via FTP

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write production .env
        run: |
          cat > .env <<'EOF'
          APP_NAME="Crawford Professionals Institute"
          APP_URL=https://crawfordinstitute.online
          APP_DEBUG=false
          APP_TIMEZONE=Africa/Kampala

          DB_DRIVER=mysql
          DB_HOST=${{ secrets.DB_HOST }}
          DB_PORT=3306
          DB_DATABASE=${{ secrets.DB_DATABASE }}
          DB_USERNAME=${{ secrets.DB_USERNAME }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}

          MAIL_HOST=${{ secrets.MAIL_HOST }}
          MAIL_PORT=587
          MAIL_ENCRYPTION=tls
          MAIL_USERNAME=${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD=${{ secrets.MAIL_PASSWORD }}
          MAIL_FROM_ADDRESS=no-reply@crawfordinstitute.online
          MAIL_FROM_NAME="Crawford Professionals Institute"

          AT_USERNAME=${{ secrets.AT_USERNAME }}
          AT_API_KEY=${{ secrets.AT_API_KEY }}
          AT_SENDER_ID=${{ secrets.AT_SENDER_ID }}
          AT_ENV=production

          FLW_PUBLIC_KEY=${{ secrets.FLW_PUBLIC_KEY }}
          FLW_SECRET_KEY=${{ secrets.FLW_SECRET_KEY }}
          FLW_SECRET_HASH=${{ secrets.FLW_SECRET_HASH }}
          FLW_CURRENCY=UGX
          EOF

      # server-dir is "./" (repo root, including public/) rather than just
      # public/, because this FTP account's home directory IS public_html —
      # the root .htaccess (see CLAUDE.md) is what rewrites into public/ and
      # blocks direct access to app/, database/, vendor/, .env, etc. in that
      # layout, since Document Root can't be repointed on this hosting plan.
      - name: Deploy over FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./
          server-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
